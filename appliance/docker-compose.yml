# Pile ADSentry de l'appliance. Lancée par systemd (adsentry.service) depuis /opt/adsentry.
#
#   caddy   : HTTPS (443) + authentification, sert le tableau de bord et relaie /api
#   api     : FastAPI (réseau interne uniquement)
#   worker  : planificateur des scans (seul service qui sort vers l'AD et Microsoft Graph)
#   ollama  : modèle IA local (CPU), réseau interne ; accès Internet uniquement pour télécharger les modèles
#
# Variables : /opt/adsentry/.env (généré par adsentry-setup)

name: adsentry

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs: [/tmp]
  restart: unless-stopped
  logging:
    driver: journald
    options: {tag: "adsentry-{{.Name}}"}

services:
  api:
    <<: *hardening
    image: adsentry:${ADSENTRY_VERSION:-latest}
    build: {context: .., dockerfile: Dockerfile}
    command: ["adsentry", "serve", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /etc/adsentry:/etc/adsentry:ro
      - /var/lib/adsentry:/var/lib/adsentry
    environment:
      ADSENTRY_MODEL: ${ADSENTRY_MODEL:-adsentry-analyst}
      TZ: ${TZ:-Africa/Tunis}
    networks: [internal]

  worker:
    <<: *hardening
    image: adsentry:${ADSENTRY_VERSION:-latest}
    command: ["adsentry", "worker"]
    volumes:
      - /etc/adsentry:/etc/adsentry:ro
      - /var/lib/adsentry:/var/lib/adsentry
    environment:
      ADSENTRY_MODEL: ${ADSENTRY_MODEL:-adsentry-analyst}
      TZ: ${TZ:-Africa/Tunis}
    networks: [internal, egress]
    healthcheck: {disable: true}

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}   # à épingler sur une version testée en production
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /var/lib/adsentry/ollama:/root/.ollama
      - ../ai/Modelfile:/models/Modelfile:ro
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        limits: {cpus: "${OLLAMA_CPUS:-6}", memory: "${OLLAMA_MEMORY:-10g}"}
    networks: [internal, models]

  # Tâche ponctuelle : télécharge les modèles et crée « adsentry-analyst » (relancée par adsentry-setup)
  ollama-init:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    profiles: [init]
    depends_on: [ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 2; done;
        ollama pull ${ADSENTRY_BASE_MODEL:-qwen3.5:4b} &&
        ollama pull nomic-embed-text &&
        ollama create adsentry-analyst -f /models/Modelfile
    environment: {OLLAMA_HOST: "http://ollama:11434"}
    volumes: ["../ai/Modelfile:/models/Modelfile:ro"]
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["443:443", "80:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - /etc/adsentry/tls:/etc/adsentry/tls:ro
      - /var/lib/adsentry/caddy:/data
    environment:
      ADSENTRY_HOSTNAME: ${ADSENTRY_HOSTNAME:-adsentry.local}
      ADSENTRY_ADMIN_USER: ${ADSENTRY_ADMIN_USER:-admin}
      ADSENTRY_ADMIN_HASH: ${ADSENTRY_ADMIN_HASH:?définir ADSENTRY_ADMIN_HASH via adsentry-setup}
      ADSENTRY_TLS: ${ADSENTRY_TLS:-internal}
    depends_on: [api]
    networks: [internal, edge]

networks:
  internal: {internal: true}   # aucun accès extérieur
  egress: {}                   # worker -> AD (LDAP/SMB/RPC) et graph.microsoft.com
  models: {}                   # ollama -> registre de modèles (à couper après installation si besoin)
  edge: {}                     # publication HTTPS
