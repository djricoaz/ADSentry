[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adsentry"
version = "0.1.0"
description = "Audit de sécurité Active Directory + PKI (ADCS) avec mapping MITRE ATT&CK et analyse IA locale (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
# pycryptodome : repli MD4 de ldap3 pour NTLM quand OpenSSL 3 désactive MD4 (Debian 12+, Ubuntu 22.04+, RHEL 9)
collect = ["ldap3>=2.9", "impacket>=0.12", "cryptography>=42", "pycryptodome>=3.20"]
entra = ["msal>=1.28"]
# swagger-ui-bundle : Swagger UI servi localement (appliance hors ligne, CSP sans CDN)
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "swagger-ui-bundle>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]
appliance = ["adsentry[collect,entra,api]"]
all = ["adsentry[collect,entra,api,dev]"]

[project.scripts]
adsentry = "adsentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/adsentry"]
# les catalogues YAML et les référentiels hors ligne sont inclus avec le paquet (src/adsentry/**)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: tests qui nécessitent Internet (téléchargement MITRE ATT&CK)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
"src/adsentry/cli.py" = ["B008"]  # idiome Typer
"src/adsentry/remediation/generator.py" = ["E501"]  # lignes de PowerShell générées, laissées entières
"tests/**" = ["E501"]
